<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>유치원 예약 상세</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/pages/school-reservation-detail.css">
  </head>
  <body>
    <div id="app" data-screen="schoolReservationDetail"></div>
    <template data-template="appReservationMemo">
      <details class="disclosure school-reservation-detail-memo-section" data-area="reservationMemo">
        <summary class="disclosure__heading">메모</summary>
        <div class="disclosure__body">
          <p class="disclosure__copy" data-field="reservationMemo"></p>
          <button class="button button--text-primary" type="button" data-action="editReservationMemo">메모 수정</button>
        </div>
      </details>
    </template>
    <template data-template="appReservationUsage">
      <section class="school-reservation-detail-section school-reservation-detail-usage-section" data-area="reservationUsage">
        <h2>이용 정보</h2>
        <dl class="school-reservation-detail-usage-list">
          <dt>등원 날짜</dt><dd data-field="reservationDate"></dd>
          <dt>이용권</dt><dd data-field="ticketName"></dd>
          <dt>회차</dt><dd data-field="ticketRound"></dd>
        </dl>
      </section>
    </template>
    <template data-template="webReservationDetail">
      <main class="school-home-web-shell" data-platform="web">
        <div data-area="webHeader"></div>
        <div class="school-home-web-layout">
          <div data-area="webNavigation" class="reservation-detail-navigation"></div>
          <section class="content reservation-detail-web-content" data-area="content">
            <div class="page-title">
              <div class="page-title__group">
                <a class="button button--icon" href="./index.html" aria-label="유치원 예약 목록으로"><img class="button__icon" src="../assets/iconChevronLeft.svg" alt=""></a>
                <h1>유치원 예약 상세</h1>
              </div>
              <button class="button button--danger" type="button" data-action="cancelReservation">예약 취소</button>
            </div>
            <div class="reservation-detail-web-cards">
              <section class="card card--section">
                <div class="reservation-detail-card-heading">
                  <h2>예약 정보</h2>
                  <span class="reservation-detail-status" data-field="status"></span>
                </div>
                <dl class="reservation-detail-info-list">
                  <dt>반려견</dt><dd data-field="pet"></dd>
                  <dt>보호자</dt><dd data-field="guardian"></dd>
                  <dt>연락처</dt><dd data-field="phone"></dd>
                </dl>
                <label class="field">
                  <span class="field__label">메모</span>
                  <textarea class="field__control reservation-detail-memo" data-field="reservationMemo" placeholder="성격, 알러지 등 필요한 내용 입력 (최대 1000자)" maxlength="1000"></textarea>
                </label>
              </section>
              <section class="card card--section">
                <div class="reservation-detail-card-heading">
                  <h2>등원일자</h2>
                </div>
                <div class="reservation-detail-date-control" data-area="reservationDateControl">
                  <input class="field__control" type="text" data-field="reservationDate" data-action="editReservationDate" aria-label="등원일자" aria-haspopup="dialog" aria-expanded="false" readonly>
                </div>
              </section>
              <section class="card card--section">
                <div class="reservation-detail-card-heading">
                  <h2>이용권</h2>
                  <button class="button button--text-primary" type="button" data-action="editReservationTicket" aria-haspopup="dialog">수정</button>
                </div>
                <div><span data-field="ticketName"></span><span class="reservation-detail-ticket-round" data-field="ticketRound"></span></div>
              </section>
            </div>
          </section>
        </div>
      </main>
    </template>
    <template data-template="reservationDatePicker">
      <div class="reservation-datepicker reservation-datepicker--popover" data-area="reservationDatePicker" role="dialog" aria-label="등원일자 선택">
        <div class="reservation-datepicker__controls">
          <button class="button button--month" type="button" data-action="previousMonth" aria-label="이전 달"><img class="button__icon button__icon--month" src="../assets/iconChevronLeft.svg" alt=""></button>
          <strong data-field="calendarMonth" aria-live="polite"></strong>
          <button class="button button--month" type="button" data-action="nextMonth" aria-label="다음 달"><img class="button__icon button__icon--month" src="../assets/iconChevronRight.svg" alt=""></button>
        </div>
        <div class="reservation-datepicker__week reservation-datepicker__weekdays">
          <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
        </div>
        <div class="reservation-datepicker__dates" data-area="calendarDates"></div>
      </div>
    </template>
    <template data-template="reservationTicketEdit">
      <section class="alert-overlay" data-area="reservationTicketEdit">
        <form class="alert-dialog reservation-ticket-edit-dialog" role="dialog" aria-modal="true" aria-labelledby="reservation-ticket-edit-title">
          <header class="reservation-ticket-edit-header">
            <h2 class="alert-dialog-title reservation-detail-form-title" id="reservation-ticket-edit-title">이용권 변경</h2>
            <button class="button button--icon reservation-ticket-edit-close" type="button" data-action="cancelTicketEdit" aria-label="이용권 변경 닫기"><img class="button__icon" src="../assets/iconClose.svg" alt=""></button>
          </header>
          <div class="reservation-ticket-edit-content">
            <section class="reservation-ticket-edit-field">
              <h3 class="reservation-ticket-edit-label">이용권</h3>
              <div class="school-registration-ticket-list" data-area="availableTickets"></div>
            </section>
            <section class="reservation-ticket-preview" data-area="ticketChangePreview" aria-label="예약 가능 횟수 변경 미리보기" aria-live="polite" hidden>
              <div class="reservation-ticket-preview__item" data-area="currentTicket">
                <h3 class="reservation-ticket-preview__label">변경 전</h3>
                <div><strong data-field="ticketName"></strong><p class="reservation-ticket-preview__summary" data-field="ticketSummary"></p></div>
                <p class="reservation-ticket-count" data-field="ticketCount"></p>
              </div>
              <span class="reservation-ticket-preview__arrow" aria-hidden="true">→</span>
              <div class="reservation-ticket-preview__item" data-area="selectedTicket">
                <h3 class="reservation-ticket-preview__label">변경 후</h3>
                <div><strong data-field="ticketName"></strong><p class="reservation-ticket-preview__summary" data-field="ticketSummary"></p></div>
                <p class="reservation-ticket-count" data-field="ticketCount"></p>
              </div>
            </section>
            <p data-field="ticketEmpty" hidden>변경 가능한 이용권이 없습니다.</p>
          </div>
          <div class="modal-footer-actions reservation-ticket-edit-actions">
            <button class="button button--primary alert-dialog__button" type="submit" data-action="saveReservationTicket" disabled>변경</button>
          </div>
        </form>
      </section>
    </template>
    <template data-template="reservationTicketRow">
      <button class="school-registration-ticket-option" type="button" data-field="ticketSelection" aria-pressed="false">
        <strong class="school-registration-ticket-option__name" data-field="ticketName"></strong>
        <div class="school-registration-ticket-option__details">
          <span class="school-registration-ticket-option__count" data-field="ticketRemaining"></span>
          <span class="school-registration-ticket-option__validity" data-field="ticketExpiry"></span>
        </div>
      </button>
    </template>
    <script type="module" src="../src/platforms/school-reservation-detail.js"></script>
  </body>
</html>
